<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Olá! Eu sou o Alan · Hi! I'm Alan 👋">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b4f3c"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Fundo com borda inferior ondulada (transparente abaixo da onda, funciona em tema claro e escuro) -->
  <path fill="url(#bg)" d="M0,0 H1200 V180 C1050,235 900,140 740,175 C580,210 460,235 300,195 C180,165 80,185 0,210 Z"/>

  <!-- Detalhes decorativos sutis -->
  <circle cx="90" cy="40" r="70" fill="#ffffff" opacity="0.06"/>
  <circle cx="1120" cy="60" r="110" fill="#ffffff" opacity="0.07"/>

  <text x="600" y="112" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="50" font-weight="800" fill="#ffffff" letter-spacing="0.5">Olá! Eu sou o Alan · Hi! I'm Alan 👋</text>
</svg>
