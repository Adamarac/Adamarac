<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Olá! Eu sou o Alan · Hi! I'm Alan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#155a42"/>
      <stop offset="50%" stop-color="#1e7a55"/>
      <stop offset="100%" stop-color="#36a06f"/>
    </linearGradient>
  </defs>

  <!-- Fundo com borda inferior curva (transparente abaixo da onda, funciona em tema claro e escuro) -->
  <path fill="url(#bg)" d="M0,0 H1200 V165 Q600,225 0,165 Z"/>


  <text x="600" y="95" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" fill="#ffffff" letter-spacing="0.5">Olá! Eu sou o Alan · Hi! I'm Alan</text>
</svg>
